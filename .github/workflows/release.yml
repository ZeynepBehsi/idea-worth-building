name: Release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: zip -r idea-worth-building.zip idea-worth-building -x '*/__pycache__/*' '*.DS_Store'

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" idea-worth-building.zip --clobber --repo "${{ github.repository }}"
